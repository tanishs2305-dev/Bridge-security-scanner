name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed so gitleaks can scan all commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install security tools
        run: pip install bandit pip-audit pytest

      - name: Run Bandit (static analysis for common Python security issues)
        run: bandit -r . -x ./examples -f screen

      - name: Run pip-audit (dependency vulnerability scan)
        run: pip-audit -r requirements.txt

      - name: Run Gitleaks (secret scanning, current files + full git history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run scanner regression tests
        run: python -m pytest tests/ -v